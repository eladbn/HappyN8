<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HappyN8</title>
    <meta name="theme-color" content="#18393E" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg?v=e9a7e653" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png?v=e9a7e653" />
    <link rel="manifest" href="/brand/manifest.webmanifest?v=e9a7e653" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Loading screen. The logo plays once (about 1.5 s); src/lib/splash.ts removes it. */
      #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #f2f3f3; transition: opacity 0.28s ease, visibility 0.28s; }
      #splash svg { width: min(220px, 56vw); height: auto; }
      #splash.out { opacity: 0; visibility: hidden; }
      @media (prefers-color-scheme: dark) {
        #splash { background: #0e1d20; }
        #splash .w[stroke="#353535"] { stroke: #ffffff; }
        #splash .w[stroke="#008060"] { stroke: #ffc530; }
      }
    </style>
  </head>
  <body>
    <!-- splash:start --><div id="splash" role="status" aria-label="Loading HappyN8"><style>#splash .tile{transform-box:fill-box;transform-origin:center;animation:hn-tile .4s cubic-bezier(.34,1.56,.64,1) both}
#splash .n1{transform-box:fill-box;transform-origin:center;animation:hn-pop .3s .15s cubic-bezier(.34,1.56,.64,1) both}
#splash .wire{stroke-dasharray:1 2;animation:hn-draw .55s .35s cubic-bezier(.65,0,.35,1) both}
#splash .n2{transform-box:fill-box;transform-origin:center;animation:hn-pop .4s .88s cubic-bezier(.34,1.56,.64,1) both}
#splash .w{stroke-dasharray:1 2;animation:hn-write .35s cubic-bezier(.65,0,.35,1) both}
#splash .packet{animation:hn-show .55s .35s}
@keyframes hn-show{from,to{opacity:1}}
@keyframes hn-tile{from{transform:scale(.6);opacity:0}}
@keyframes hn-pop{from{transform:scale(0)}}
@keyframes hn-draw{from{stroke-dashoffset:1}}
@keyframes hn-write{from{stroke-dashoffset:1;opacity:0}1%{opacity:1}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash .packet{display:none}}</style><svg viewBox="0 0 200 158" width="200" height="158" aria-hidden="true"><g transform="translate(52 0) scale(1.5)"><rect class="tile" width="64" height="64" rx="16" fill="#008060"/><g transform="translate(6.14 6.64) scale(.202)"><path class="wire" d="M36 112C36 146 58 158 88 158H108C120 158 128 164 128 176C128 164 136 158 148 158H168C198 158 220 146 220 112" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/><circle class="packet" r="13" fill="#FFC530" opacity="0"><animateMotion path="M36 112C36 146 58 158 88 158H108C120 158 128 164 128 176C128 164 136 158 148 158H168C198 158 220 146 220 112" begin="0.35s" dur="0.55s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".65 0 .35 1"/></circle><circle class="n1" cx="86" cy="86" r="18" fill="#FFFFFF"/><circle class="n2" cx="170" cy="86" r="18" fill="#FFC530"/></g></g><g transform="translate(15.4 116.7) scale(.6)"><g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path class="w" d="M0 0V40" stroke="#353535" style="animation-delay:0.78s" pathLength="1"/><path class="w" d="M28 0V40" stroke="#353535" style="animation-delay:0.83s" pathLength="1"/><path class="w" d="M0 18H7C11 18 14 20 14 25C14 20 17 18 21 18H28" stroke="#353535" style="animation-delay:0.88s" pathLength="1"/><path class="w" d="M72 26a14 14 0 1 0 -28 0a14 14 0 1 0 28 0" stroke="#353535" style="animation-delay:0.83s" pathLength="1"/><path class="w" d="M72 12V40" stroke="#353535" style="animation-delay:0.88s" pathLength="1"/><path class="w" d="M88 12V56" stroke="#353535" style="animation-delay:0.88s" pathLength="1"/><path class="w" d="M88 26a14 14 0 1 1 28 0a14 14 0 1 1 -28 0" stroke="#353535" style="animation-delay:0.93s" pathLength="1"/><path class="w" d="M132 12V56" stroke="#353535" style="animation-delay:0.93s" pathLength="1"/><path class="w" d="M132 26a14 14 0 1 1 28 0a14 14 0 1 1 -28 0" stroke="#353535" style="animation-delay:0.98s" pathLength="1"/><path class="w" d="M176 12V25a13 13 0 0 0 26 0" stroke="#353535" style="animation-delay:0.98s" pathLength="1"/><path class="w" d="M202 12V44a14 14 0 0 1 -14 14" stroke="#353535" style="animation-delay:1.03s" pathLength="1"/><path class="w" d="M218 40V0L244 40V0" stroke="#008060" style="animation-delay:1.03s" pathLength="1"/><path class="w" d="M271 18a9 9 0 1 1 0 -18a9 9 0 1 1 0 18a11 11 0 1 0 0 22a11 11 0 1 0 0 -22" stroke="#008060" style="animation-delay:1.08s" pathLength="1"/></g></g></svg></div><!-- splash:end -->
    <script>
      // Reduced motion: show the finished logo instead of playing it.
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        var s = document.querySelector('#splash svg');
        if (s && s.pauseAnimations) { s.setCurrentTime(5); s.pauseAnimations(); }
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
