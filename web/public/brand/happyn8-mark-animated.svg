<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="HappyN8"><title>HappyN8</title><style>.tile{transform-box:fill-box;transform-origin:center;animation:hn-tile .4s cubic-bezier(.34,1.56,.64,1) both}
.n1{transform-box:fill-box;transform-origin:center;animation:hn-pop .3s .15s cubic-bezier(.34,1.56,.64,1) both}
.wire{stroke-dasharray:1 2;animation:hn-draw .55s .35s cubic-bezier(.65,0,.35,1) both}
.n2{transform-box:fill-box;transform-origin:center;animation:hn-pop .4s .88s cubic-bezier(.34,1.56,.64,1) both}
.w{stroke-dasharray:1 2;animation:hn-write .35s cubic-bezier(.65,0,.35,1) both}
.packet{animation:hn-show .55s .35s}
@keyframes hn-show{from,to{opacity:1}}
@keyframes hn-tile{from{transform:scale(.6);opacity:0}}
@keyframes hn-pop{from{transform:scale(0)}}
@keyframes hn-draw{from{stroke-dashoffset:1}}
@keyframes hn-write{from{stroke-dashoffset:1;opacity:0}1%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.packet{display:none}}</style><rect class="tile" width="64" height="64" rx="16" fill="#008060"/><g transform="translate(6.14 6.64) scale(.202)"><path class="wire" d="M36 112C36 146 58 158 88 158H108C120 158 128 164 128 176C128 164 136 158 148 158H168C198 158 220 146 220 112" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/><circle class="packet" r="13" fill="#FFC530" opacity="0"><animateMotion path="M36 112C36 146 58 158 88 158H108C120 158 128 164 128 176C128 164 136 158 148 158H168C198 158 220 146 220 112" begin="0.35s" dur="0.55s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".65 0 .35 1"/></circle><circle class="n1" cx="86" cy="86" r="18" fill="#FFFFFF"/><circle class="n2" cx="170" cy="86" r="18" fill="#FFC530"/></g></svg>
